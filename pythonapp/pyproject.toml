[project]
name = "kctest"
version = "0.1.0"
description = "Keycloak Test Client"
requires-python = ">=3.13"
dependencies = [
    "authlib>=1.6.4",
    "dataone-auth",
    "flask>=3.1.2",
    "flask-oidc>=2.4.0",
    "pyjwt>=2.10.1",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
]

[tool.uv.sources]
dataone-auth = { git = "https://github.com/DataONEorg/dataone-auth.git", rev = "feature-generalize-api" }
